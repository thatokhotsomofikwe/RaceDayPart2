name: RaceDay API CI

on:
  push:
    branches: [ "**" ]        # every push, any branch (master or main)
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:           # lets you run it manually from the Actions tab

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: RaceDay.API..csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore "$PROJECT"

      - name: Build
        run: dotnet build "$PROJECT" --no-restore --configuration Release

      - name: Run unit tests
        run: |
          TEST_PROJECTS=$(find . -name '*Tests*.csproj' -not -path './obj/*')
          if [ -z "$TEST_PROJECTS" ]; then
            echo "::warning::No test project found in the repository - skipping tests."
            exit 0
          fi
          for proj in $TEST_PROJECTS; do
            dotnet test "$proj" --configuration Release --verbosity normal
          done

      - name: Publish
        run: dotnet publish "$PROJECT" --no-build --configuration Release --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: raceday-api
          path: ./publish
          retention-days: 7
