name: RaceDay Part 2 - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore, Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find project and .NET version
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No C# project (.csproj) was found."
            exit 1
          fi

          FRAMEWORK=$(grep -oPm1 \
            '(?<=<TargetFramework>)[^<]+' "$PROJECT" || true)

          if [ -z "$FRAMEWORK" ]; then
            echo "ERROR: Could not identify TargetFramework in $PROJECT"
            exit 1
          fi

          case "$FRAMEWORK" in
            net8.0*) SDK="8.0.x" ;;
            net9.0*) SDK="9.0.x" ;;
            net10.0*) SDK="10.0.x" ;;
            *)
              echo "ERROR: Unsupported or unconfigured framework: $FRAMEWORK"
              exit 1
              ;;
          esac

          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "sdk=$SDK" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"
          echo "Target framework: $FRAMEWORK"
          echo "Using .NET SDK: $SDK"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.project.outputs.sdk }}

      - name: Restore dependencies
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build API
        run: >
          dotnet build "${{ steps.project.outputs.path }}"
          --configuration Release
          --no-restore

      - name: Run tests if available
        shell: bash
        run: |
          mapfile -t TEST_PROJECTS < <(
            find . -type f \
              \( -name '*Tests.csproj' -o -name '*Test.csproj' \) \
              -not -path '*/bin/*' \
              -not -path '*/obj/*'
          )

          if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
            echo "No separate test project found."
            echo "Test step skipped; API build was checked separately."
          else
            for TEST_PROJECT in "${TEST_PROJECTS[@]}"; do
              echo "Running tests in $TEST_PROJECT"
              dotnet test "$TEST_PROJECT" \
                --configuration Release
            done
          fi
